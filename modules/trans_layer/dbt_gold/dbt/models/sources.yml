version: 2

sources:
  # current state per key, written by the Spark job (MERGE INTO)
  - name: silver
    database: awsdatacatalog
    schema: "{{ env_var('SILVER_SCHEMA') }}"
    # 2nd DQ layer: checks the Spark job's dedup + MERGE really left 1 row per key
    tables:
      - name: teachers
        columns:
          - name: teacher_id
            data_tests: [unique, not_null]
      - name: students
        columns:
          - name: student_id
            data_tests: [unique, not_null]
      - name: class_bookings
        columns:
          - name: booking_id
            data_tests: [unique, not_null]
      - name: payments
        columns:
          - name: payment_id
            data_tests: [unique, not_null]
          # payment of a student not in Silver (quarantined / not merged yet).
          # Gold keeps the revenue (orphan row), this only names the students.
          - name: student_id
            data_tests:
              - relationships:
                  arguments:
                    to: source('silver', 'students')
                    field: student_id
                  config:
                    severity: warn
          # a refund whose purchase is missing would silently drop out of net revenue
          - name: refund_of
            data_tests:
              - relationships:
                  arguments:
                    to: source('silver', 'payments')
                    field: payment_id
      - name: referrals
        columns:
          - name: referral_id
            data_tests: [unique, not_null]

  # append-only log of every CDC event (Athena INSERT from Raw)
  - name: bronze
    database: awsdatacatalog
    schema: "{{ env_var('BRONZE_SCHEMA') }}"
    tables:
      - name: class_bookings
